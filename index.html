<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>To-Do List App</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      height: 100vh;
      background: linear-gradient(to right, #e0eafc, #cfdef3);
    }

    .sidebar {
      width: 220px;
      background-color: #2c3e50;
      color: #ecf0f1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .sidebar h2 {
      margin-bottom: 20px;
      font-size: 1.2rem;
      text-align: center;
    }

    .list-item {
      padding: 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.3s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .list-item:hover,
    .list-item.active {
      background-color: #34495e;
    }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      font-size: 1.2rem;
      cursor: pointer;
      margin-left: 10px;
    }

    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
      padding: 30px;
      max-width: 700px;
      width: 100%;
      transition: box-shadow 0.3s ease;
    }

    .card:hover {
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.15);
    }

    .card h2 {
      margin-bottom: 20px;
      text-align: center; /* Center the heading */
    }

    .task-input {
      display: flex;
      margin-bottom: 20px;
    }

    .task-input input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px 0 0 6px;
      font-size: 1rem;
    }

    .task-input button {
      padding: 10px 20px;
      border: none;
      background-color: #3498db;
      color: white;
      border-radius: 0 6px 6px 0;
      cursor: pointer;
      transition: background 0.3s;
    }

    .task-input button:hover {
      background-color: #2980b9;
    }

    .tasks {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .task {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      margin-bottom: 10px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s;
    }

    .task:hover {
      transform: translateX(5px);
    }

    .task.completed {
      text-decoration: line-through;
      color: #999;
      background-color: #f0f0f0;
    }

    .task button {
      background: none;
      border: none;
      color: red;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .category-label {
      font-size: 0.9rem;
      color: #7f8c8d;
      margin-left: 10px;
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <h2>My Lists</h2>
    <div id="list-container">
      <div class="list-item active">Default</div>
      <div class="list-item">Personal</div>
      <div class="list-item">Shopping</div>
      <div class="list-item">Wishlist</div>
      <div class="list-item">Work</div>
      <div class="list-item">Finished</div>
    </div>
    <div style="margin-top: 20px;">
      <input id="newListName" placeholder="+ New List" style="width:100%;padding:8px;border-radius:4px;border:none;">
    </div>
  </div>

  <div class="main">
    <div class="card">
      <h2 id="list-title">Default</h2>
      <div class="task-input">
        <input type="text" id="taskInput" placeholder="Add a new task...">
        <button onclick="addTask()">Add</button>
      </div>
      <ul class="tasks" id="taskList"></ul>
    </div>
  </div>

  <script>
    const listContainer = document.getElementById('list-container');
    const taskList = document.getElementById('taskList');
    const taskInput = document.getElementById('taskInput');
    const listTitle = document.getElementById('list-title');
    const newListName = document.getElementById('newListName');

    let currentList = 'Default';
    const tasks = {
      'Default': [],
      'Personal': [],
      'Shopping': [],
      'Wishlist': [],
      'Work': [],
      'Finished': [],
    };

    function renderTasks() {
      taskList.innerHTML = '';
      (tasks[currentList] || []).forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task' + (task.completed ? ' completed' : '');
        li.innerHTML = `
          <span onclick="toggleTask(${index})">${task.text}</span>
          ${currentList === 'Finished' ? `<span class="category-label">(${task.originalCategory})</span>` : ''}
          <button onclick="deleteTask(${index})">&times;</button>
        `;
        taskList.appendChild(li);
      });
    }

    function addTask() {
      const value = taskInput.value.trim();
      if (!value) return;
      tasks[currentList].push({ text: value, completed: false, originalCategory: currentList });
      taskInput.value = '';
      renderTasks();
    }

    function toggleTask(index) {
      const task = tasks[currentList][index];
      if (currentList !== 'Finished') {
        tasks[currentList].splice(index, 1);
        task.completed = true;
        task.originalCategory = currentList;
        tasks['Finished'].push(task);
      } else {
        task.completed = !task.completed;
      }
      renderTasks();
    }

    function deleteTask(index) {
      tasks[currentList].splice(index, 1);
      renderTasks();
    }

    listContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('list-item') && !e.target.classList.contains('delete-btn')) {
        document.querySelectorAll('.list-item').forEach(el => el.classList.remove('active'));
        e.target.classList.add('active');
        currentList = e.target.innerText;
        listTitle.textContent = currentList;
        if (!tasks[currentList]) tasks[currentList] = [];
        renderTasks();
      }
    });

    listContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) {
        const listName = e.target.parentNode.textContent.replace("×", "").trim();
        if (tasks[listName]) {
          delete tasks[listName];
        }
        e.target.parentNode.remove();
        if (listName === currentList) {
          currentList = 'Default';
          listTitle.textContent = 'Default';
          renderTasks();
        }
      }
    });

    newListName.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        const name = newListName.value.trim();
        if (name && !tasks[name]) {
          tasks[name] = [];
          const div = document.createElement('div');
          div.className = 'list-item';
          div.textContent = name;

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'delete-btn';
          deleteBtn.textContent = '×';
          div.appendChild(deleteBtn);

          listContainer.appendChild(div);
          newListName.value = '';
        }
      }
    });

    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    renderTasks();
  </script>

</body>
</html>
